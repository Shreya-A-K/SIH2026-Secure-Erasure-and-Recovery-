name: Auto-generate requirements.txt

on:
  push:
    branches: [ "main", "role1", "role2", "role3", "role4", "role5", "role6" ]
    paths-ignore:
      - 'requirements.txt'

jobs:
  update-requirements:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Generator Tools
      run: |
        python -m pip install --upgrade pip
        pip install pipreqs

    - name: Generate requirements.txt from Code
      run: |
        # Scans project imports and creates/overwrites requirements.txt
        pipreqs . --force --ignore .venv,tests

    - name: Commit and Push Changes
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: auto-update requirements.txt from imports"
        file_pattern: "requirements.txt"